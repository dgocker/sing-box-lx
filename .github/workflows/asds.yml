steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # [ИСПРАВЛЕНИЕ]: Откатываем NDK до стабильной LTS-версии (r26d), 
      # чтобы gomobile мог успешно пройти инициализацию
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Setup OpenJDK 17
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk-headless

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          git tag "$TAG" -f || true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build libbox.aar (arm64 only)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go get -tool golang.org/x/mobile/cmd/gobind
          go mod tidy
          
          TAGS="$(make -f Makefile.lx -s lx-print-tags)"
          echo "Building with tags: $TAGS"
          
          gomobile bind -v -a -trimpath \
            -target=android/arm64 \
            -androidapi 21 \
            -tags "$TAGS" \
            -ldflags "-s -w -buildid= -checklinkname=0" \
            -o libbox.aar \
            ./experimental/libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Package AAR
        run: |
          mkdir -p dist
          V="${{ steps.ver.outputs.version }}"
          cp libbox.aar "dist/libbox-$V-arm64.aar"

      - uses: actions/upload-artifact@v4
        with:
          name: singbox-aar-arm64
          path: dist/*
          if-no-files-found: error

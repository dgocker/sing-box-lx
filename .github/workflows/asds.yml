name: Build Android AAR (arm64 only)


on:

  push:

    tags: ['v*-lx.*'] # Автозапуск при пуше тега релиза (например, v1.13.13-lx.1)

  workflow_dispatch:  # Позволяет запускать сборку вручную из вкладки Actions

    inputs:

      tag:

        description: 'Release tag (e.g. v1.13.13-lx.1). Leave empty to use current ref.'

        required: false


permissions:

  contents: write


jobs:

  build_android:

    name: build android (libbox.aar arm64)

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

        with:

          submodules: recursive

          fetch-depth: 0


      - uses: actions/setup-go@v5

        with:

          go-version-file: go.mod

          check-latest: true


      - name: Setup Android NDK

        id: setup-ndk

        uses: nttld/setup-ndk@v1

        with:

          ndk-version: r28


      - name: Setup OpenJDK 17

        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk-headless


      - name: Resolve version

        id: ver

        run: |

          TAG="${{ inputs.tag || github.ref_name }}"

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # Локально ставим тег, чтобы генератор версии ядра правильно записал её в код

          git tag "$TAG" -f || true


      - name: Install gomobile

        run: |

          go install golang.org/x/mobile/cmd/gomobile@latest

          go install golang.org/x/mobile/cmd/gobind@latest

          gomobile init

        env:

          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}


      - name: Build libbox.aar (arm64 only)

        run: |

          export PATH="$PATH:$(go env GOPATH)/bin"

          

          # Легализуем утилиту gobind (исправление для Go 1.24+)

          go get -tool golang.org/x/mobile/cmd/gobind

          go mod tidy

          

          # Считываем теги из конфига разраба

          TAGS="$(make -f Makefile.lx -s lx-print-tags)"

          echo "Building with tags: $TAGS"

          

          # Собираем AAR. 

          # ДОБАВЛЕНО: флаг -checklinkname=0 в ldflags для обхода блокировки приватных функций Go

          gomobile bind -v -a -trimpath \

            -target=android/arm64 \

            -androidapi 21 \

            -tags "$TAGS" \

            -ldflags "-s -w -buildid= -checklinkname=0" \

            -o libbox.aar \

            ./experimental/libbox

        env:

          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}


      - name: Package AAR

        run: |

          mkdir -p dist

          V="${{ steps.ver.outputs.version }}"

          cp libbox.aar "dist/libbox-$V-arm64.aar"


      - uses: actions/upload-artifact@v4

        with:

          name: singbox-aar-arm64

          path: dist/*

          if-no-files-found: error
